# Global build settings that apply to all deploy contexts
[build]
  # Command to build your site (e.g., "npm run build", "yarn build", "ng build --prod")
  command = "npm run build"
  # Directory to publish (e.g., "dist", "build", "public")
  publish = "build"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200