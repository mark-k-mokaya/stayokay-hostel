# Global build settings that apply to all deploy contexts
[build]
  # Command to build your site (e.g., "npm run build", "yarn build", "ng build --prod")
  command = "npm run build"
  # Directory to publish (e.g., "dist", "build", "public")
  publish = "build"
  # Optional: The base directory for all build settings (e.g., if your project is in a subdirectory)
  # base = "frontend/"

# Wildcard redirect to a custom 404 page (or a Single Page App handler)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Functions settings
[functions]
  # Directory for your serverless functions
  directory = "netlify/functions"
